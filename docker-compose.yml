version: "3.9"

services:
  db:
    image: postgres:15
    container_name: teamflow-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: teamflow-api
    command: ./entrypoint.sh
    ports:
      - "8000:8000"
    environment:
      ENV: dev
      DATABASE_URL: postgresql://postgres:postgres@db:5432/teamflow
      SECRET_KEY: supersecret
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      PYTHONPATH: .
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  postgres_data: